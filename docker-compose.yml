version: "3.9"

services:
  vinyas-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DEMO_SAFE_MODE=${DEMO_SAFE_MODE:-true}
    volumes:
      - ./data:/app/data
      - ./config:/app/config

  vinyas-ai-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    environment:
      - BACKEND_API_URL=http://vinyas-ai-backend:8000
    depends_on:
      - vinyas-ai-backend
    volumes:
      - ./data:/app/data
      - ./config:/app/config
